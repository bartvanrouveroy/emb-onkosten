<style>
:root{
  --navy:#14213d; --navy2:#22335c; --accent:#f59e0b; --bg:#f2f3f7; --card:#fff; --text:#1b1f2a; --muted:#6b7280;
  --line:#e5e7eb; --ok:#15803d; --okbg:#dcfce7; --warn:#b45309; --warnbg:#fef3c7; --bad:#b91c1c; --badbg:#fee2e2;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(76px + var(--sab))}
header{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:calc(10px + var(--sat)) 16px 12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px}
.brand .logo{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--navy);display:grid;place-items:center;font-size:12px;font-weight:800;letter-spacing:.5px}
.brand small{display:block;font-weight:400;opacity:.7;font-size:12px}
.period{display:flex;align-items:center;justify-content:space-between;margin-top:10px;background:var(--navy2);border-radius:12px;padding:4px}
.period button{background:none;border:0;color:#fff;font-size:22px;width:44px;height:36px;border-radius:9px}
.period button:active{background:rgba(255,255,255,.12)}
.period .lbl{font-weight:600;text-transform:capitalize}
main{padding:14px 14px 30px;max-width:720px;margin:0 auto}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;padding-bottom:var(--sab)}
nav.tabs button{flex:1;background:none;border:0;padding:8px 0 9px;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button .ic{font-size:21px;line-height:1}
nav.tabs button.on{color:var(--navy);font-weight:600}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:18px 4px 8px;font-weight:600}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--card);border-radius:14px;padding:12px 14px}
.stat b{display:block;font-size:20px;margin-top:2px}
.stat span{font-size:12px;color:var(--muted)}
.list{background:var(--card);border-radius:14px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.row:active{background:#f7f7fa}
.thumb{width:46px;height:56px;border-radius:7px;object-fit:cover;background:#e5e7eb;flex:none}
.grow{flex:1;min-width:0}
.title{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-weight:700;text-align:right;white-space:nowrap}
.chip{display:inline-block;font-size:11px;padding:2px 7px;border-radius:20px;font-weight:600;margin-top:3px}
.ok{background:var(--okbg);color:var(--ok)} .warn{background:var(--warnbg);color:var(--warn)} .bad{background:var(--badbg);color:var(--bad)} .neu{background:#eef0f4;color:#4b5563}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:13px 16px;font-size:16px;font-weight:600;background:var(--navy);color:#fff;width:100%;cursor:pointer;text-decoration:none}
.btn.sec{background:#e8ebf2;color:var(--navy)} .btn.acc{background:var(--accent);color:var(--navy)} .btn.danger{background:var(--badbg);color:var(--bad)}
.btn:disabled{opacity:.5}
.btn+.btn{margin-top:8px}
.btns2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btns2 .btn+.btn{margin-top:0}
.fab{position:fixed;right:16px;bottom:calc(80px + var(--sab));z-index:25;width:auto;padding:15px 20px;border-radius:30px;box-shadow:0 6px 18px rgba(20,33,61,.35);background:var(--accent);color:var(--navy)}
.empty{text-align:center;color:var(--muted);padding:30px 20px}
.empty .big{font-size:44px}
label.f{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--text);-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,#888 50%),linear-gradient(135deg,#888 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat}
textarea{min-height:64px}
.padwrap{position:relative;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;touch-action:none}
.padwrap canvas{display:block;touch-action:none;position:relative;z-index:2}
.padline{position:absolute;left:8%;right:8%;bottom:28%;border-bottom:1.5px dashed #c5cad6;z-index:1}
.padname{position:absolute;left:8%;bottom:10%;font-size:12px;color:#9ca3af;z-index:1}
.sigprev{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center;margin-bottom:6px}.sigprev img{max-width:100%;max-height:90px}
.notacard .sub,.notacard .title{white-space:normal}
.pdfico{width:42px;height:52px;border-radius:6px;background:#dc2626;color:#fff;font-weight:800;font-size:12px;display:grid;place-items:center;flex:none}
.viewer{position:fixed;inset:0;z-index:85;background:#3b4050;display:flex;flex-direction:column}
.vbar{display:flex;align-items:center;gap:10px;padding:calc(8px + var(--sat)) 12px 8px;background:var(--navy);color:#fff}
.vbar .sub{color:#c7cbd6}
.vbody{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:10px 0 calc(20px + var(--sab))}
.vbody canvas{display:block;margin:0 auto 10px;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.35)}
.vload{color:#d1d5db;text-align:center;padding:40px 20px}
.vatbox{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:10px}
.vathead,.vatrow{display:grid;grid-template-columns:1.1fr 1.2fr 1fr 32px;gap:6px;align-items:center}
.vathead{font-size:12px;color:var(--muted);margin-bottom:4px}
.vatrow{margin-bottom:6px}.vatrow input,.vatrow select{padding:9px 8px;font-size:16px}
input.ro{background:#f3f4f6;color:#374151}input.neg{color:var(--bad);border-color:var(--bad)}
.btn.small{padding:9px 12px;font-size:14px}.x.sm{width:28px;height:28px;font-size:13px}
input[type=checkbox]{-webkit-appearance:checkbox;appearance:auto;width:22px;height:22px;padding:0;margin:0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.backdrop{position:fixed;inset:0;background:rgba(10,15,30,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:8px 16px calc(20px + var(--sab));animation:up .2s ease-out}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:#cfd3dc;margin:4px auto 10px}
.sheet h3{margin:4px 0 12px;font-size:19px}
.sheethead{display:flex;justify-content:space-between;align-items:center}
.x{background:#e3e6ee;border:0;border-radius:50%;width:32px;height:32px;font-size:16px;color:#555}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.photo{width:100%;max-height:260px;object-fit:contain;background:#222;border-radius:12px;display:block}
.prog{height:6px;border-radius:3px;background:#e3e6ee;overflow:hidden;margin:10px 0 4px}
.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.note{font-size:13px;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + var(--sab));background:#111827;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:90;max-width:90%;text-align:center;animation:fade .2s}
table.mini{width:100%;border-collapse:collapse;font-size:14px}
table.mini td{padding:7px 0;border-bottom:1px solid var(--line)}
table.mini td:last-child{text-align:right;font-weight:600}
table.mini tr:last-child td{border-bottom:0}
.seg{display:flex;background:#e3e6ee;border-radius:10px;padding:3px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:8px;font-weight:600;color:#555;font-size:15px}
.seg button.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.banner{background:var(--warnbg);color:#78350f;border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:12px}
details summary{cursor:pointer;color:var(--muted);font-size:13px;margin-top:10px}
pre.ocr{white-space:pre-wrap;font-size:11px;background:#fff;border-radius:8px;padding:8px;max-height:180px;overflow:auto}
.chk{width:22px;height:22px;flex:none;accent-color:var(--navy)}
.diff{font-size:13px;margin-top:6px}
.zoom{position:fixed;inset:0;background:#000;z-index:80;display:flex;align-items:center;justify-content:center}
.zoom img{max-width:100%;max-height:100%}
</style>
</head>
<body>
<header>
  <div class="brand"><div class="logo">EMB</div><div><span data-t="appName">EMB Onkosten</span><small data-t="appSub">VISA-onkostennota</small></div></div>

function loadImage(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file);const i=new Image();i.onload=()=>{res(i)};i.onerror=rej;i.src=u;});}
function toJpeg(img,maxEdge,q){const s=Math.min(1,maxEdge/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*s);c.height=Math.round(img.naturalHeight*s);
 c.getContext('2d').drawImage(img,0,0,c.width,c.height);return{url:c.toDataURL('image/jpeg',q),w:c.width,h:c.height};}
function ocrCanvas(img){const s=Math.min(1,2000/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement('canvas');c.width=Math.round(img.naturalWidth*s);c.height=Math.round(img.naturalHeight*s);
 const x=c.getContext('2d');x.drawImage(img,0,0,c.width,c.height);const d=x.getImageData(0,0,c.width,c.height),p=d.data;let mn=255,mx=0;const g=new Uint8ClampedArray(p.length/4);
 for(let i=0,j=0;i<p.length;i+=4,j++){const v=0.299*p[i]+0.587*p[i+1]+0.114*p[i+2];g[j]=v;if(v<mn)mn=v;if(v>mx)mx=v;}
 const rg=Math.max(1,mx-mn);for(let i=0,j=0;i<p.length;i+=4,j++){let v=(g[j]-mn)*255/rg;v=v<110?Math.max(0,v*0.6):Math.min(255,v*1.15);p[i]=p[i+1]=p[i+2]=v;}
 x.putImageData(d,0,0);return c;}
let ocrWorkerP=null,ocrProgressCb=null;
function getOcr(){if(!window.Tesseract)return Promise.reject(new Error('Tesseract not loaded'));
 if(!ocrWorkerP){ocrWorkerP=Promise.race([Tesseract.createWorker(['nld','fra'],1,{logger:m=>ocrProgressCb&&ocrProgressCb(m)}),new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),60000))]).catch(e=>{ocrWorkerP=null;throw e});}
 return ocrWorkerP;}
async function runOcr(img,onProg){ocrProgressCb=onProg;const w=await getOcr();const {data}=await w.recognize(ocrCanvas(img));return data.text||'';}

const AMT_RE=/-?\d{1,3}(?:[.\s]\d{3})*[.,]\d{2}(?!\d)|-?\d+[.,]\d{2}(?!\d)/g;
function amountsIn(line){return (line.match(AMT_RE)||[]).map(parseNum).filter(n=>!isNaN(n)&&Math.abs(n)<100000);}
function parseReceipt(text){
 const raw=text.replace(/\r/g,'');const lines=raw.split('\n').map(s=>s.trim()).filter(Boolean);const low=raw.toLowerCase();const out={};
 // date
 const now=new Date();
 for(const ln of lines){let m=ln.match(/(\d{1,2})\s?[\/.\-]\s?(\d{1,2})\s?[\/.\-]\s?(\d{4}|\d{2})(?!\d)/)||null;let y,mo,d;
  if(m){d=+m[1];mo=+m[2];y=+m[3];if(y<100)y+=2000;} else {m=ln.match(/(20\d{2})[\/.\-](\d{1,2})[\/.\-](\d{1,2})/);if(m){y=+m[1];mo=+m[2];d=+m[3];}}
  if(m&&mo>=1&&mo<=12&&d>=1&&d<=31){const dt=new Date(y,mo-1,d);if(dt<=new Date(now.getTime()+864e5*2)&&(now-dt)<864e5*730){out.date=`${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`;break;}}}
 // total
 const kw=/(te\s*betalen|a\s*payer|à\s*payer|totaal|total|totale|montant|bedrag|visa|bancontact|maestro|mastercard|carte|kaart|betaald|payé|eur\b)/i;
 const excl=/(btw|tva|vat|excl|htva|hvat|sub|basis|base|maatst|wisselgeld|rendu|retour|korting|remise)/i;
 let cands=[];lines.forEach((ln,i)=>{if(kw.test(ln)&&!excl.test(ln)){const a=amountsIn(ln);if(!a.length&&lines[i+1])a.push(...amountsIn(lines[i+1]).slice(0,1));a.forEach(n=>n>0&&cands.push(n));}});
 if(cands.length)out.amount=Math.max(...cands);
 else{const all=lines.flatMap(amountsIn).filter(n=>n>0&&n<20000);if(all.length)out.amount=Math.max(...all);}
 // VAT
 let vat=0,rates=new Set(),vl=[];
 lines.forEach(ln=>{const rm=ln.match(/(?:^|[^\d,.])(2[,.]10?|5[,.]50?|6|9|10|12|20|21)(?:[,.]0{1,2})?\s?%/);if(!rm)return;const r=parseNum(rm[1]);const a=amountsIn(ln).filter(n=>n>0&&Math.abs(n-r)>0.001);
  for(let i=0;i<a.length;i++)for(let j=0;j<a.length;j++)if(i!==j&&Math.abs(a[i]*r/100-a[j])<=0.02){vat+=a[j];rates.add(r);vl.push({rate:r,gross:r2(a[i]+a[j]),vat:a[j]});return;}
  for(let i=0;i<a.length;i++)for(let j=0;j<a.length;j++)if(i!==j&&Math.abs(a[i]*r/(100+r)-a[j])<=0.02){vat+=a[j];rates.add(r);vl.push({rate:r,gross:a[i],vat:a[j]});return;}});
 if(rates.size){out.vat=r2(vat);out.vatRate=rates.size>1?'mix':[...rates][0];out.vatLines=vl;}
 // country
 const rs=[...rates];
 if(rs.some(r=>[2.1,5.5,10,20].includes(r))||/\b(siret|siren|n° tva intracom)/i.test(low))out.country='FR';
 else if(rs.includes(9)||/\b(kvk|nl\d{9}b\d{2})/i.test(low))out.country='NL';
 else if(rs.some(r=>r===6||r===12)||/\bbe\s?0\d{3}[.\s]?\d{3}[.\s]?\d{3}/i.test(low))out.country='BE';
 // category
 for(const k in CAT_KW){if(CAT_KW[k].some(w=>low.includes(w))){out.category=k;break;}}
 // merchant
 const bad=/(ticket|kasticket|reçu|recu|facture|factuur|btw|tva|tel|tél|www|http|@|^\d)/i;
 for(const ln of lines.slice(0,6)){const letters=(ln.match(/[A-Za-zÀ-ÿ]/g)||[]).length;if(letters>=3&&!bad.test(ln)&&!AMT_RE.test(ln)){out.merchant=ln.replace(/[^\wÀ-ÿ&'().,\- ]/g,'').replace(/\s+/g,' ').trim().slice(0,40);AMT_RE.lastIndex=0;break;}AMT_RE.lastIndex=0;}
 if(out.merchant&&out.merchant===out.merchant.toUpperCase())out.merchant=out.merchant.toLowerCase().replace(/\b\w/g,c=>c.toUpperCase());
 return out;}

function pdfWorker(){if(!window.pdfjsLib)throw new Error('pdf.js not loaded');if(!pdfWorker.done){const v=pdfjsLib.version||'3.11.174';
 const src=`https://cdnjs.cloudflare.com/ajax/libs/pdf.js/${v}/pdf.worker.min.js`;
 try{pdfjsLib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob([`importScripts("${src}");`],{type:'text/javascript'}));}catch(e){pdfjsLib.GlobalWorkerOptions.workerSrc=src;}pdfWorker.done=1;}}
async function pdfLines(file){pdfWorker();const buf=await file.arrayBuffer();const pdf=await pdfjsLib.getDocument({data:buf}).promise;const out=[];
 for(let p=1;p<=pdf.numPages;p++){const page=await pdf.getPage(p);const tc=await page.getTextContent();const rows=[];
  tc.items.forEach(it=>{if(!it.str||!it.str.trim())return;const y=it.transform[5],x=it.transform[4];let r=rows.find(r=>Math.abs(r.y-y)<2.5);if(!r){r={y,items:[]};rows.push(r);}r.items.push({x,s:it.str,w:it.width||0});});
  rows.sort((a,b)=>b.y-a.y).forEach(r=>{r.items.sort((a,b)=>a.x-b.x);let s='',lastEnd=null;r.items.forEach(i=>{if(lastEnd!=null&&i.x-lastEnd>3)s+='  ';else if(lastEnd!=null)s+='';s+=i.s;lastEnd=i.x+i.w;});out.push(s.replace(/\s{3,}/g,'  ').trim());});}
 return out;}
function dmy(s){const m=s.match(/(\d{2})\/(\d{2})\/(\d{4})/);return m?`${m[3]}-${m[2]}-${m[1]}`:null;}
function parseVisaMeta(lines){const all=lines.join('\n');const meta={};
 let m=all.match(/(cl[ôo]ture|afsluit\w*|closing)[^\d]{0,40}(\d{2}\/\d{2}\/\d{4})/i);if(m)meta.close=dmy(m[2]);
 m=all.match(/(?:du|van|from|vanaf)\s+(\d{2}\/\d{2}\/\d{4})\s+(?:au|tot|to|t\/m)\s+(\d{2}\/\d{2}\/\d{4})/i);if(m){meta.from=dmy(m[1]);meta.to=dmy(m[2]);}
 if(!meta.close&&meta.to)meta.close=meta.to;
 lines.forEach(l=>{const m=l.match(/^(totaal|total|totaal uitgaven|total des dépenses)\b[^\d]*(\d{1,3}(?:[.\s]\d{3})*,\d{2})/i);if(m&&meta.total==null)meta.total=parseNum(m[2]);});
 m=all.match(/(?:Num[ée]ro de carte|Kaartnummer)\s*([\dX ]{12,})/i);if(m)meta.card=m[1].replace(/\s+/g,' ').trim();
 return meta;}
function parseVisaLines(lines,period,meta){
 meta=meta||{};const [py,pm]=period.split('-').map(Number);const res=[];
 const skip=/^(totaal|total\b|saldo|solde|vorig|précédent|precedent|nieuw saldo|nouveau solde|limiet|limite|plafond|uw betaling|votre paiement|domiciliëring|domiciliation|rente|intérêts|overzicht|relevé|pagina|page)/i;
 lines.forEach((ln,i)=>{
  const dm=ln.match(/^(\d{1,2})[\/.\-](\d{1,2})(?:[\/.\-](\d{2,4}))?/);if(!dm)return;
  const am=ln.match(/(-?\s?\d{1,3}(?:[.\s]\d{3})*,\d{2}|-?\d+\.\d{2})\s*(EUR|€)?\s*(-|\+|CR|DB|D|C)?\s*$/i);if(!am)return;
  let d=+dm[1],m=+dm[2],y=dm[3]?+dm[3]:null;if(m<1||m>12||d<1||d>31)return;if(y!=null&&y<100)y+=2000;if(y==null){if(meta.from&&meta.to){const f=new Date(meta.from)-864e5*7,tt=+new Date(meta.to)+864e5*7;const ys=[+meta.to.slice(0,4),+meta.from.slice(0,4)];y=ys.find(yy=>{const dt=new Date(yy,m-1,d);return dt>=f&&dt<=tt;})||ys[0];}else{y=py;if(m-pm>6)y--;if(pm-m>6)y++;}}
  let body=ln.slice(dm[0].length,ln.length-am[0].length).trim();
  body=body.replace(/^(\d{1,2}[\/.\-]\d{1,2}(?:[\/.\-]\d{2,4})?\s*)+/,'').replace(/\b(USD|GBP|CHF|SEK|NOK|DKK|PLN|CZK)\s*-?\d+[.,]\d{2}.*$/i,'').replace(/\s{2,}.*?\d+[.,]\d{2}\s*$/,'').replace(/\s+/g,' ').trim();
  if(skip.test(body))return;
  let amt=parseNum(am[1].replace(/\s/g,''));if(isNaN(amt)||amt===0)return;
  const suf=(am[3]||'').toUpperCase();const credit=suf==='+'||suf==='CR'||suf==='C'||/terugbetaling|remboursement|refund|crédit|credit/i.test(body);
  const ccm=body.match(/\s([A-Z]{2})$/);const cc=ccm?ccm[1]:'';body=body.replace(/\s+[A-Z]{2}$/,'');
  res.push({id:uid(),country:cc,period,date:`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`,merchant:body.slice(0,60)||'—',amount:r2(Math.abs(amt)),credit,ticketId:null,noTicket:false,order:i});});
 return res;}

 if(!rec.files.some(f=>f.name===file.name&&f.size===file.size))rec.files.push({name:file.name,size:file.size,data:buf,addedAt:Date.now()});
 st.stmts.set(per,rec);await DB.put('stmts',rec);}catch(e){console.warn(e);}}

async function autoMatch(p,silent){
 const lines=visaOf(p).filter(l=>!l.ticketId&&!l.noTicket&&!l.credit);const linked=new Set(st.visa.map(l=>l.ticketId).filter(Boolean));
 const cands=st.tickets.filter(x=>!linked.has(x.id)&&Math.abs(monthDiff(x.period,p))<=1);const pairs=[];
 lines.forEach(l=>cands.forEach(x=>{if(Math.abs(l.amount-x.amount)<=0.011){const dd=dayDiff(l.date,x.date);if(dd<=10)pairs.push([dd+(x.period===p?0:5),l,x]);}}));
 pairs.sort((a,b)=>a[0]-b[0]);const uL=new Set,uT=new Set;let n=0;
 for(const [,l,x] of pairs){if(uL.has(l.id)||uT.has(x.id))continue;uL.add(l.id);uT.add(x.id);l.ticketId=x.id;await saveLine(l);n++;}
 if(!silent)render();return n;}

 if(dl){for(const f of files){try{await dl.save({filename:f.name,data:f});}catch(e){try{await dl.save({filename:f.name,data:new Uint8Array(await f.arrayBuffer())});}catch(e2){console.warn(e2);}}}return false;}

 else if(a==='update'){toast(t('updating'),4000);try{if(navigator.serviceWorker){const rs=await navigator.serviceWorker.getRegistrations();for(const r of rs){await r.update().catch(()=>{});}}if(window.caches){const ks=await caches.keys();for(const k of ks)await caches.delete(k);}}catch(err){}setTimeout(()=>location.reload(),600);}
 else if(a==='lang'){S.lang=el.dataset.v;saveSettings();render();}
 else if(a==='exportBackup')exportBackup();
 else if(a==='importBackup'){const i=$('#backupIn');i.value='';i.click();}
 else if(a==='sample')loadSample();
 else if(a==='wipe')confirmSheet(t('wipeConfirm'),t('yes'),async()=>{await DB.clear('tickets');await DB.clear('visa');await DB.clear('notas');st.tickets=[];st.visa=[];st.notas.clear();render();});});
$('#main').addEventListener('input',e=>{const k=e.target.dataset.set;if(k){S[k]=e.target.value.trim();saveSettings();}if(e.target.dataset.change==='notaNote'){S.notes[st.period]=e.target.value;saveSettings();}});
$('#main').addEventListener('change',e=>{if(e.target.dataset.change==='notaNote')render();});

 x.fillStyle='#14213d';for(let i=0;i<4;i++)x.fillRect(52,58+i*18,i===3?40:76,7);x.font='bold 30px -apple-system,Arial';x.textAlign='center';x.fillStyle='#fff';x.fillText('€',128,150);$('#touchIcon').href=c.toDataURL('image/png');}catch(e){}}
const APP_VERSION='1.6';
let IS_DEMO=false;try{IS_DEMO=window.self!==window.top||/claude\.ai|claudeusercontent|anthropic/.test(location.hostname);}catch(e){IS_DEMO=true;}
(async function init(){makeIcon();render();await DB.open();st.tickets=await DB.all('tickets');st.visa=await DB.all('visa');(await DB.all('notas')).forEach(n=>st.notas.set(n.id,n));(await DB.all('stmts')).forEach(n=>st.stmts.set(n.id,n));render();
 if('serviceWorker' in navigator&&location.protocol==='https:'&&!IS_DEMO){
  const had=!!navigator.serviceWorker.controller;let reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&!reloaded){reloaded=true;location.reload();}});
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{r.update().catch(()=>{});document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')r.update().catch(()=>{});});}).catch(()=>{});}
 downloadsCap();})();
